<!doctype html>
<html lang="zh-CN" data-guide-locale="zh-CN" data-locale-base="../../locales/">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字序列二维码 | 二维码生成器</title>
    <meta
      name="description"
      content="生成一个二维码或带有可选前缀和后缀的编号序列。"
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link
      rel="canonical"
      href="https://qr.lewismoten.com/guides/content/number.zh-CN.html"
    />
    <link rel="stylesheet" href="../../dist/app.min.css" />
  </head>
  <body class="info-page-body">
    <main class="standalone-info-page">
      <article class="info-dialog-shell">
        <header class="info-dialog-header info-page-header">
          <div>
            <p class="info-kicker">二维码生成器</p>
            <h1>数字序列二维码</h1>
          </div>
          <a
            class="info-page-back"
            href="../../index.html#tab=content&amp;subtab=data"
            >在生成器中打开</a
          >
        </header>
        <div class="info-dialog-content">
          <section class="fragment-help-copy" data-fragment-help>
            <h2>高效地创建有序代码</h2>
            <p>
              数字模式可以创建一个单个数字二维码或一个完整的序列。开始、结束和步数控制序列；可选的前缀和后缀可以创建标签，如ITEM-12-A。
            </p>
            <p>
              纯数字使用二维码数字编码。添加字母或符号会自动选择一个兼容的编码模式。
            </p>
          </section>
          <fieldset
            class="option-group format-fields"
            data-app-fragment="tab=content&amp;subtab=data"
          >
            <legend data-i18n="form.data.numberSeries">Number series</legend>
            <div class="number-range-grid">
              <div>
                <label for="number-start" data-i18n="form.data.start"
                  >Start</label
                >
                <input
                  id="number-start"
                  name="number-start"
                  type="number"
                  inputmode="numeric"
                  step="1"
                  value="1"
                />
              </div>
              <div>
                <label for="number-end" data-i18n="form.data.end">End</label>
                <input
                  id="number-end"
                  name="number-end"
                  type="number"
                  inputmode="numeric"
                  step="1"
                  value="8"
                />
              </div>
              <div>
                <label for="number-step" data-i18n="form.data.step">Step</label>
                <input
                  id="number-step"
                  name="number-step"
                  type="number"
                  inputmode="numeric"
                  min="1"
                  step="1"
                  value="1"
                />
              </div>
            </div>
            <div class="number-affix-grid">
              <div>
                <label for="number-prefix" data-i18n="form.data.prefixOptional"
                  >Prefix (optional)</label
                >
                <input
                  id="number-prefix"
                  name="number-prefix"
                  type="text"
                  maxlength="32"
                  placeholder="ITEM-"
                  data-i18n-placeholder="form.placeholders.numberPrefix"
                />
              </div>
              <div>
                <label for="number-suffix" data-i18n="form.data.suffixOptional"
                  >Suffix (optional)</label
                >
                <input
                  id="number-suffix"
                  name="number-suffix"
                  type="text"
                  maxlength="32"
                  placeholder="-A"
                  data-i18n-placeholder="form.placeholders.numberSuffix"
                />
              </div>
            </div>
            <label class="slider-field" for="number-sequence-index">
              <span data-i18n="form.data.currentValue">Current value</span>
              <output id="number-sequence-value" for="number-sequence-index"
                >1 / 8 - 1</output
              >
            </label>
            <input
              id="number-sequence-index"
              name="number-sequence-index"
              type="range"
              min="1"
              max="8"
              step="1"
              value="1"
            />
          </fieldset>
          <section class="fragment-help-copy" data-fragment-help>
            <h2>顺序行为</h2>
            <p>
              当前值滑块预览一个项目，而不会改变系列。下载工具可以将完整的序列作为ZIP、PDF表格、动画GIF或MP4格式导出。
            </p>
          </section>
        </div>
        <footer class="info-page-footer">
          <span>二维码生成器</span>
          <nav aria-label="指南页面导航">
            <a href="../../index.html#tab=content&amp;subtab=data"
              >打开这个工具</a
            >
            <a href="../about.zh-CN.html">关于</a>
            <a href="../index.zh-CN.html">指南</a>
            <a href="../../privacy.html">隐居</a>
          </nav>
        </footer>
      </article>
    </main>
    <script type="module" src="../../dist/info.min.js"></script>
  </body>
</html>
