<!doctype html>
<html lang="zh-CN" data-guide-locale="zh-CN" data-locale-base="../../locales/">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电子邮件二维码 | 二维码生成器</title>
    <meta
      name="description"
      content="创建带有收件人、主题和消息的电子邮件二维码。"
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link
      rel="canonical"
      href="https://qr.lewismoten.com/guides/content/email.zh-CN.html"
    />
    <link rel="stylesheet" href="../../dist/app.min.css" />
  </head>
  <body class="info-page-body">
    <main class="standalone-info-page">
      <article class="info-dialog-shell">
        <header class="info-dialog-header info-page-header">
          <div>
            <p class="info-kicker">二维码生成器</p>
            <h1>电子邮件二维码</h1>
          </div>
          <a
            class="info-page-back"
            href="../../index.html#tab=content&amp;subtab=data"
            >在生成器中打开</a
          >
        </header>
        <div class="info-dialog-content">
          <section class="fragment-help-copy" data-fragment-help>
            <h2>准备一封电子邮件</h2>
            <p>
              扫描后，接收人的电子邮件应用程序会打开，地址和可选主题和正文已填写。
            </p>
          </section>
          <fieldset
            class="option-group format-fields"
            data-app-fragment="tab=content&amp;subtab=data"
          >
            <legend data-i18n="formats.email">Email</legend>
            <label for="email-to" data-i18n="form.data.to">To</label>
            <input
              id="email-to"
              name="email-to"
              type="email"
              maxlength="254"
              placeholder="name@example.com"
              data-i18n-placeholder="form.placeholders.email"
            />
            <label for="email-subject" data-i18n="form.data.subjectOptional"
              >Subject (optional)</label
            >
            <input
              id="email-subject"
              name="email-subject"
              type="text"
              maxlength="120"
              placeholder="Subject"
              data-i18n-placeholder="fields.subject"
            />
            <label for="email-body" data-i18n="form.data.bodyOptional"
              >Body (optional)</label
            >
            <textarea
              id="email-body"
              name="email-body"
              rows="3"
              maxlength="7089"
              placeholder="Message"
              data-i18n-placeholder="fields.message"
            ></textarea>
            <p id="email-body-length-hint" class="hint">0 / 0</p>
          </fieldset>
          <section class="fragment-help-copy" data-fragment-help>
            <h2>容量和验证</h2>
            <p>
              可用的身体长度会随着接收者和对象消耗二维码容量而调整。在使用前会报告无效的地址。
            </p>
          </section>
        </div>
        <footer class="info-page-footer">
          <span>二维码生成器</span>
          <nav aria-label="指南页面导航">
            <a href="../../index.html#tab=content&amp;subtab=data"
              >打开这个工具</a
            >
            <a href="../about.zh-CN.html">关于</a>
            <a href="../index.zh-CN.html">指南</a>
            <a href="../../privacy.html">隐居</a>
          </nav>
        </footer>
      </article>
    </main>
    <script type="module" src="../../dist/info.min.js"></script>
  </body>
</html>
