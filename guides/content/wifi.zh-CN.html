<!doctype html>
<html lang="zh-CN" data-guide-locale="zh-CN" data-locale-base="../../locales/">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wi-Fi二维码 | 二维码生成器</title>
    <meta
      name="description"
      content="为WPA、WEP、开放式和隐藏式无线网络创建 Wi-Fi 二维码。"
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link
      rel="canonical"
      href="https://qr.lewismoten.com/guides/content/wifi.zh-CN.html"
    />
    <link rel="stylesheet" href="../../dist/app.min.css" />
  </head>
  <body class="info-page-body">
    <main class="standalone-info-page">
      <article class="info-dialog-shell">
        <header class="info-dialog-header info-page-header">
          <div>
            <p class="info-kicker">二维码生成器</p>
            <h1>Wi-Fi二维码</h1>
          </div>
          <a
            class="info-page-back"
            href="../../index.html#tab=content&amp;subtab=data"
            >在生成器中打开</a
          >
        </header>
        <div class="info-dialog-content">
          <section class="fragment-help-copy" data-fragment-help>
            <h2>无需键入即可共享网络访问权限</h2>
            <p>
              Wi-Fi二维码有效数据存储了网络名称、安全类型、密码和隐藏网络标志。兼容的手机可以在扫描后可以提示加入网络。
            </p>
            <p>
              WPA/2/3涵盖了现代的WPA系列网络。开放式网络不使用密码，而WEP保留用于旧设备。
            </p>
          </section>
          <fieldset
            class="option-group format-fields"
            data-app-fragment="tab=content&amp;subtab=data"
          >
            <legend data-i18n="formats.wifi">Wi-Fi</legend>
            <label for="wifi-ssid" data-i18n="form.data.networkName"
              >Network name</label
            >
            <input
              id="wifi-ssid"
              name="wifi-ssid"
              type="text"
              maxlength="32"
              placeholder="My Wi-Fi"
              data-i18n-placeholder="form.data.networkPlaceholder"
            />
            <label for="wifi-password" data-i18n="wifi.password"
              >Password</label
            >
            <input
              id="wifi-password"
              name="wifi-password"
              type="password"
              maxlength="64"
              autocomplete="current-password"
              placeholder="Password"
              data-i18n-placeholder="wifi.password"
            />
            <label for="wifi-encryption" data-i18n="form.data.security"
              >Security</label
            >
            <div
              id="wifi-encryption-buttons"
              class="choice-grid choice-grid-compact wifi-security-grid"
              role="radiogroup"
              aria-label="Wi-Fi security"
              data-i18n-aria-label="form.data.wifiSecurity"
            >
              <button
                type="button"
                class="choice-button is-active"
                data-choice-target="wifi-encryption"
                data-choice-value="WPA"
                aria-pressed="true"
                data-i18n="form.data.wpa"
              >
                WPA/2/3
              </button>
              <button
                type="button"
                class="choice-button"
                data-choice-target="wifi-encryption"
                data-choice-value="WEP"
                aria-pressed="false"
                data-i18n="form.data.wep"
              >
                WEP
              </button>
              <button
                type="button"
                class="choice-button"
                data-choice-target="wifi-encryption"
                data-choice-value="nopass"
                aria-pressed="false"
                data-i18n="form.data.open"
              >
                Open
              </button>
            </div>
            <select
              id="wifi-encryption"
              name="wifi-encryption"
              class="sr-only"
              aria-hidden="true"
              tabindex="-1"
            >
              <option value="WPA" data-i18n="form.data.wpaLong">
                WPA/WPA2/WPA3
              </option>
              <option value="WEP" data-i18n="form.data.wep">WEP</option>
              <option value="nopass" data-i18n="form.data.open">Open</option>
            </select>
            <label class="toggle-field">
              <input id="wifi-hidden" name="wifi-hidden" type="checkbox" />
              <span data-i18n="form.data.hiddenNetwork">Hidden network</span>
            </label>
          </fieldset>
          <section class="fragment-help-copy" data-fragment-help>
            <h2>密码隐私</h2>
            <p>
              编码的二维码必须包含真实的网络密码。有效载荷预览默认隐藏它，但任何能够解码完成的二维码的人都可以恢复它。相应地分享代码。
            </p>
          </section>
        </div>
        <footer class="info-page-footer">
          <span>二维码生成器</span>
          <nav aria-label="指南页面导航">
            <a href="../../index.html#tab=content&amp;subtab=data"
              >打开这个工具</a
            >
            <a href="../about.zh-CN.html">关于</a>
            <a href="../index.zh-CN.html">指南</a>
            <a href="../../privacy.html">隐居</a>
          </nav>
        </footer>
      </article>
    </main>
    <script type="module" src="../../dist/info.min.js"></script>
  </body>
</html>
