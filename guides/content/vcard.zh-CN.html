<!doctype html>
<html lang="zh-CN" data-guide-locale="zh-CN" data-locale-base="../../locales/">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vCard二维码 | 二维码生成器</title>
    <meta name="description" content="为便携式联系信息创建 vCard 二维码。" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link
      rel="canonical"
      href="https://qr.lewismoten.com/guides/content/vcard.zh-CN.html"
    />
    <link rel="stylesheet" href="../../dist/app.min.css" />
  </head>
  <body class="info-page-body">
    <main class="standalone-info-page">
      <article class="info-dialog-shell">
        <header class="info-dialog-header info-page-header">
          <div>
            <p class="info-kicker">二维码生成器</p>
            <h1>vCard联系人二维码</h1>
          </div>
          <a
            class="info-page-back"
            href="../../index.html#tab=content&amp;subtab=data"
            >在生成器中打开</a
          >
        </header>
        <div class="info-dialog-content">
          <section class="fragment-help-copy" data-fragment-help>
            <h2>分享联系信息</h2>
            <p>
              vCard
              二维码包裹了一个姓名、组织、职位、电话、电子邮件和网站，以便导入到兼容的联系人应用程序中。
            </p>
          </section>
          <fieldset
            class="option-group format-fields"
            data-app-fragment="tab=content&amp;subtab=data"
          >
            <legend data-i18n="formats.vcard">vCard</legend>
            <label for="vcard-name" data-i18n="fields.fullName"
              >Full name</label
            >
            <input
              id="vcard-name"
              name="vcard-name"
              type="text"
              autocomplete="name"
              maxlength="80"
              placeholder="Taylor Example"
              value="Lewis Moten III"
              data-i18n-placeholder="form.placeholders.personName"
              data-i18n-value="form.defaults.vcardName"
            />
            <label for="vcard-org" data-i18n="fields.organization"
              >Organization</label
            >
            <input
              id="vcard-org"
              name="vcard-org"
              type="text"
              autocomplete="organization"
              maxlength="80"
              placeholder="OpenAI"
              value="LewisMoten.com"
              data-i18n-placeholder="form.placeholders.organization"
              data-i18n-value="form.defaults.vcardOrganization"
            />
            <label for="vcard-title" data-i18n="fields.title">Title</label>
            <input
              id="vcard-title"
              name="vcard-title"
              type="text"
              autocomplete="organization-title"
              maxlength="80"
              placeholder="Engineer"
              value="Owner"
              data-i18n-placeholder="form.placeholders.jobTitle"
              data-i18n-value="form.defaults.vcardTitle"
            />
            <label for="vcard-phone" data-i18n="formats.phone">Phone</label>
            <input
              id="vcard-phone"
              name="vcard-phone"
              type="tel"
              autocomplete="tel"
              maxlength="40"
              placeholder="+15551234567"
              value="+15305394775"
              data-i18n-placeholder="form.placeholders.phone"
              data-i18n-value="form.defaults.phone"
            />
            <label for="vcard-email" data-i18n="formats.email">Email</label>
            <input
              id="vcard-email"
              name="vcard-email"
              type="email"
              autocomplete="email"
              maxlength="254"
              placeholder="name@example.com"
              value="lewismoten@gmail.com"
              data-i18n-placeholder="form.placeholders.email"
              data-i18n-value="form.defaults.vcardEmail"
            />
            <label for="vcard-url" data-i18n="form.data.website">Website</label>
            <input
              id="vcard-url"
              name="vcard-url"
              type="url"
              autocomplete="url"
              maxlength="2048"
              placeholder="https://example.com"
              value="https://lewismoten.com"
              data-i18n-placeholder="form.placeholders.website"
              data-i18n-value="form.defaults.vcardWebsite"
            />
          </fieldset>
          <section class="fragment-help-copy" data-fragment-help>
            <h2>分享前请先查看</h2>
            <p>
              发布前请验证每个字段。网站URL需要协议，建议使用HTTPS而不是未加密的HTTP。
            </p>
          </section>
        </div>
        <footer class="info-page-footer">
          <span>二维码生成器</span>
          <nav aria-label="指南页面导航">
            <a href="../../index.html#tab=content&amp;subtab=data"
              >打开这个工具</a
            >
            <a href="../about.zh-CN.html">关于</a>
            <a href="../index.zh-CN.html">指南</a>
            <a href="../../privacy.html">隐居</a>
          </nav>
        </footer>
      </article>
    </main>
    <script type="module" src="../../dist/info.min.js"></script>
  </body>
</html>
