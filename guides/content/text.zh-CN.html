<!doctype html>
<html lang="zh-CN" data-guide-locale="zh-CN" data-locale-base="../../locales/">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本二维码 | 二维码生成器</title>
    <meta name="description" content="为纯文本消息和备忘录创建二维码。" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link
      rel="canonical"
      href="https://qr.lewismoten.com/guides/content/text.zh-CN.html"
    />
    <link rel="stylesheet" href="../../dist/app.min.css" />
  </head>
  <body class="info-page-body">
    <main class="standalone-info-page">
      <article class="info-dialog-shell">
        <header class="info-dialog-header info-page-header">
          <div>
            <p class="info-kicker">二维码生成器</p>
            <h1>发送二维码文本</h1>
          </div>
          <a
            class="info-page-back"
            href="../../index.html#tab=content&amp;subtab=data"
            >在生成器中打开</a
          >
        </header>
        <div class="info-dialog-content">
          <section class="fragment-help-copy" data-fragment-help>
            <h2>直接编码消息</h2>
            <p>
              文本二维码可以存储笔记、说明、标识符和其他可打印内容，无需网站或网络。
            </p>
          </section>
          <fieldset
            class="option-group format-fields"
            data-app-fragment="tab=content&amp;subtab=data"
          >
            <legend class="sr-only" data-i18n="form.data.textContent">
              Text content
            </legend>
            <label
              class="sr-only"
              for="text-input"
              data-i18n="form.data.textPayload"
              >Text payload</label
            >
            <textarea
              id="text-input"
              name="text-input"
              rows="4"
              maxlength="7089"
              placeholder="Enter any text"
              data-i18n-placeholder="form.data.enterText"
            ></textarea>
          </fieldset>
          <section class="fragment-help-copy" data-fragment-help>
            <h2>编码行为</h2>
            <p>
              除非选择手动模式，否则生成器会自动选择高效的数字、字母数字或字节段。
            </p>
          </section>
        </div>
        <footer class="info-page-footer">
          <span>二维码生成器</span>
          <nav aria-label="指南页面导航">
            <a href="../../index.html#tab=content&amp;subtab=data"
              >打开这个工具</a
            >
            <a href="../about.zh-CN.html">关于</a>
            <a href="../index.zh-CN.html">指南</a>
            <a href="../../privacy.html">隐居</a>
          </nav>
        </footer>
      </article>
    </main>
    <script type="module" src="../../dist/info.min.js"></script>
