<!doctype html>
<html lang="zh-CN" data-guide-locale="zh-CN" data-locale-base="../../locales/">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地理位置二维码 | 二维码生成器</title>
    <meta
      name="description"
      content="创建带有经过验证的坐标、标签和交互式地图的地理二维码。"
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link
      rel="canonical"
      href="https://qr.lewismoten.com/guides/content/geo.zh-CN.html"
    />
    <link rel="stylesheet" href="../../dist/app.min.css" />
    <link rel="stylesheet" href="../../dist/chunks/geo-map.min.css" />
  </head>
  <body class="info-page-body">
    <main class="standalone-info-page">
      <article class="info-dialog-shell">
        <header class="info-dialog-header info-page-header">
          <div>
            <p class="info-kicker">二维码生成器</p>
            <h1>地理位置二维码</h1>
          </div>
          <a
            class="info-page-back"
            href="../../index.html#tab=content&amp;subtab=data"
            >在生成器中打开</a
          >
        </header>
        <div class="info-dialog-content">
          <section class="fragment-help-copy" data-fragment-help>
            <h2>编码一个精确的位置</h2>
            <p>
              地理二维码使用纬度和经度在兼容的地图软件中打开位置。一个可选标签为坐标提供一个可识别的名称。
            </p>
            <p>
              纬度必须在-90和90之间；经度必须在-180和180之间。在典型条件下，五位小数位可以定位在大约一米内的一个点。
            </p>
          </section>
          <fieldset
            class="option-group format-fields"
            data-app-fragment="tab=content&amp;subtab=data"
          >
            <legend data-i18n="formats.geo">Geo</legend>
            <div class="geo-row">
              <div class="geo-field">
                <label for="geo-latitude" data-i18n="form.data.latitude"
                  >Latitude</label
                >
                <input
                  id="geo-latitude"
                  name="geo-latitude"
                  type="text"
                  inputmode="decimal"
                  maxlength="24"
                  value="38.9182"
                />
              </div>
              <div class="geo-field">
                <label for="geo-longitude" data-i18n="form.data.longitude"
                  >Longitude</label
                >
                <input
                  id="geo-longitude"
                  name="geo-longitude"
                  type="text"
                  inputmode="decimal"
                  maxlength="24"
                  value="-78.1944"
                />
              </div>
              <div class="geo-field geo-label-field">
                <label for="geo-query" data-i18n="form.data.label">Label</label>
                <input
                  id="geo-query"
                  name="geo-query"
                  type="text"
                  maxlength="80"
                  value="Front Royal, VA"
                  data-i18n-value="form.defaults.geoLabel"
                />
              </div>
            </div>
            <div class="geo-map-card">
              <div
                id="geo-map"
                class="geo-map"
                aria-label="Interactive map preview. Drag to pan, use the controls to zoom, or click to choose coordinates."
                data-i18n-aria-label="form.data.mapLabel"
              ></div>
            </div>
          </fieldset>
          <section class="fragment-help-copy" data-fragment-help>
            <h2>使用地图</h2>
            <p>
              点击地图以替换坐标，拖动以平移，并使用控制器进行缩放。OpenStreetMap地图图块只有在选择地理格式后才会加载。
            </p>
          </section>
        </div>
        <footer class="info-page-footer">
          <span>二维码生成器</span>
          <nav aria-label="指南页面导航">
            <a href="../../index.html#tab=content&amp;subtab=data"
              >打开这个工具</a
            >
            <a href="../about.zh-CN.html">关于</a>
            <a href="../index.zh-CN.html">指南</a>
            <a href="../../privacy.html">隐居</a>
          </nav>
        </footer>
      </article>
    </main>
    <script type="module" src="../../dist/info.min.js"></script>
  </body>
</html>
