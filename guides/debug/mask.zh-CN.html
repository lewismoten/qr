<!doctype html>
<html lang="zh-CN" data-guide-locale="zh-CN" data-locale-base="../../locales/">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二维码面罩图案 | 二维码生成器</title>
    <meta
      name="description"
      content="比较所有八种二维码掩模图案，并了解选择。"
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link
      rel="canonical"
      href="https://qr.lewismoten.com/guides/debug/mask.zh-CN.html"
    />
    <link rel="stylesheet" href="../../dist/app.min.css" />
  </head>
  <body class="info-page-body">
    <main class="standalone-info-page">
      <article class="info-dialog-shell">
        <header class="info-dialog-header info-page-header">
          <div>
            <p class="info-kicker">二维码生成器</p>
            <h1>二维码掩模图案</h1>
          </div>
          <a
            class="info-page-back"
            href="../../index.html#tab=debug&amp;subtab=mask"
            >在生成器中打开</a
          >
        </header>
        <div class="info-dialog-content">
          <section class="fragment-help-copy" data-fragment-help>
            <h2>平衡模块模式</h2>
            <p>
              二维码编码评估了八个掩模，并通常选择视觉惩罚最低的掩模。掩模可以减少扫描仪混淆的运行、块、类似查找器的形状和暗模块的不平衡。
            </p>
          </section>
          <fieldset
            class="option-group"
            data-app-fragment="tab=debug&amp;subtab=mask"
          >
            <legend data-i18n="debugUi.mask.legend">Mask pattern</legend>
            <div
              id="mask-grid"
              class="mask-grid"
              role="radiogroup"
              aria-label="Mask pattern choices"
              data-i18n-aria-label="debugUi.mask.choices"
            ></div>
          </fieldset>
          <section class="fragment-help-copy" data-fragment-help>
            <h2>自动和手动选择</h2>
            <p>
              自动显示所选的掩码。编号选项强制使用该掩码进行比较。缩略图使用紧凑的版本2样本，因此即使活动代码很大，每个图案仍然可见。完整的公式和处罚规则在规格中。
            </p>
            <p><a href="../spec.zh-CN.html">阅读二维码规格指南</a></p>
          </section>
        </div>
        <footer class="info-page-footer">
          <span>二维码生成器</span>
          <nav aria-label="指南页面导航">
            <a href="../../index.html#tab=debug&amp;subtab=mask"
              >打开这个工具</a
            >
            <a href="../index.zh-CN.html">指南</a>
            <a href="../spec.zh-CN.html">规范</a>
            <a href="../../privacy.html">隐居</a>
          </nav>
        </footer>
      </article>
    </main>
    <script type="module" src="../../dist/info.min.js"></script>
